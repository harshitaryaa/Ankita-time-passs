<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Time - Ankita</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Girlish, playful font */
            background: linear-gradient(135deg, #ffb3ba, #ffdfba, #ffffba, #baffc9, #bae1ff); /* Soft pastel gradient */
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite; /* Animated background */
            margin: 0;
            padding: 0;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .date-time {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 1.2em;
            color: #ff69b4;
            animation: fadeIn 2s ease-in-out;
        }

        .container {
            max-width: 1000px;
            margin: 100px auto 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 2s ease-in-out;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #ff69b4;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .tools {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .tool:hover {
            transform: scale(1.05);
        }

        #canvas {
            border: 2px solid #ff69b4;
            border-radius: 10px;
            background: white;
            cursor: crosshair;
        }

        button {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            font-size: 2em;
            color: #ff69b4;
            animation: float 6s ease-in-out infinite;
        }

        .heart:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { top: 20%; right: 15%; animation-delay: 2s; }
        .heart:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 4s; }
        .heart:nth-child(4) { top: 30%; right: 10%; animation-delay: 1s; }
        .heart:nth-child(5) { bottom: 20%; right: 20%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="date-time" id="date-time"></div>

    <div class="container">
        <h1>Drawing Time, Ankita! 🎨</h1>
        <p>Draw something fun to pass the time! Use the tools below. 💕</p>
        
        <div class="tools">
            <input type="color" id="color-picker" class="tool" value="#ff69b4">
            <input type="range" id="brush-size" class="tool" min="1" max="50" value="5">
            <button onclick="clearCanvas()" class="tool">Clear</button>
            <button onclick="saveDrawing()" class="tool">Save Drawing</button>
        </div>
        
        <canvas id="canvas" width="800" height="500"></canvas>
        
        <button onclick="goBack()">Back</button>
    </div>

    <script>
        // Update date and time in left corner
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('date-time').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('color-picker');
        const brushSize = document.getElementById('brush-size');

        let drawing = false;

        // Start drawing
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });

        // Draw
        canvas.addEventListener('mousemove', (e) => {
            if (drawing) {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = colorPicker.value;
                ctx.lineWidth = brushSize.value;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        });

        // Stop drawing
        canvas.addEventListener('mouseup', () => {
            drawing = false;
        });

        canvas.addEventListener('mouseout', () => {
            drawing = false;
        });

        // Clear canvas
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Save drawing as image
        function saveDrawing() {
            const link = document.createElement('a');
            link.download = 'ankita-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Go back to fourth page (chatbot)
        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
