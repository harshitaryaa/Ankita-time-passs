<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker - Ankita</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Girlish, playful font */
            background: linear-gradient(135deg, #ffb3ba, #ffdfba, #ffffba, #baffc9, #bae1ff); /* Soft pastel gradient */
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite; /* Animated background */
            margin: 0;
            padding: 0;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .date-time {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 1.2em;
            color: #ff69b4;
            animation: fadeIn 2s ease-in-out;
        }

        .container {
            max-width: 800px;
            margin: 100px auto 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 2s ease-in-out;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #ff69b4;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .mood-list {
            margin-top: 40px;
            text-align: left;
        }

        .mood-entry {
            background: rgba(255, 182, 193, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            animation: slideIn 1s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .entry-content {
            flex-grow: 1;
        }

        .entry-actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn, .delete-btn {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 0.8em;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .edit-btn:hover, .delete-btn:hover {
            transform: scale(1.1);
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-in-out;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            margin: 15% auto;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .mood-options {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .mood-btn {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5em;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .mood-btn:hover {
            transform: scale(1.2);
        }

        textarea {
            width: 100%;
            height: 100px;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            font-family: inherit;
            resize: none;
        }

        button {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Next Page Button with Cool Animation */
        .next-page-btn {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            border-radius: 25px;
            padding: 15px 30px;
            font-size: 1.2em;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            animation: bounce 2s infinite;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .next-page-btn:hover {
            animation: none;
            transform: scale(1.1);
        }

        /* Flower animation for bad moods */
        .flower {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            color: #ff69b4;
            animation: bloom 2s ease-in-out;
            z-index: 10;
        }

        @keyframes bloom {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            font-size: 2em;
            color: #ff69b4;
            animation: float 6s ease-in-out infinite;
        }

        .heart:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { top: 20%; right: 15%; animation-delay: 2s; }
        .heart:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 4s; }
        .heart:nth-child(4) { top: 30%; right: 10%; animation-delay: 1s; }
        .heart:nth-child(5) { bottom: 20%; right: 20%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="date-time" id="date-time"></div>
    <div class="flower" id="flower">🌸</div> <!-- Flower for bad moods -->

    <div class="container">
        <h1>Mood kaisa hai, Ankita?</h1>
        <p>Your mood tracker! Check the list below for previous entries.</p>
        <button onclick="openAddMoreModal()">Add More</button> <!-- Button to add more details -->
        <button class="next-page-btn" onclick="goToNextPage()">Next Page</button> <!-- Animated button to next page -->
        <div class="mood-list" id="mood-list"></div>
    </div>

    <!-- Mood Modal -->
    <div id="mood-modal" class="modal">
        <div class="modal-content">
            <h2>Aaj mood kesa h madam aapka?</h2>
            <div class="mood-options">
                <button class="mood-btn" onclick="selectMood('😊')">😊</button>
                <button class="mood-btn" onclick="selectMood('😢')">😢</button>
                <button class="mood-btn" onclick="selectMood('😴')">😴</button>
                <button class="mood-btn" onclick="selectMood('😡')">😡</button>
                <button class="mood-btn" onclick="selectMood('😍')">😍</button>
            </div>
            <button onclick="openWriteModal()">Write about your mood</button>
        </div>
    </div>

    <!-- Write Modal -->
    <div id="write-modal" class="modal">
        <div class="modal-content">
            <h2>Write about your mood</h2>
            <textarea id="mood-text" placeholder="How are you feeling today?"></textarea>
            <button onclick="saveMoodWithText()">Save</button>
            <button onclick="closeModal('write-modal')">Cancel</button>
        </div>
    </div>

    <!-- Add More Modal -->
    <div id="add-more-modal" class="modal">
        <div class="modal-content">
            <h2>Add More Details</h2>
            <textarea id="add-more-text" placeholder="Add more about your day or mood..."></textarea>
            <button onclick="saveAddMore()">Save</button>
            <button onclick="closeModal('add-more-modal')">Cancel</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2>Edit Mood Entry</h2>
            <div class="mood-options">
                <button class="mood-btn" onclick="setEditMood('😊')">😊</button>
                <button class="mood-btn" onclick="setEditMood('😢')">😢</button>
                <button class="mood-btn" onclick="setEditMood('😴')">😴</button>
                <button class="mood-btn" onclick="setEditMood('😡')">😡</button>
                <button class="mood-btn" onclick="setEditMood('😍')">😍</button>
            </div>
            <textarea id="edit-text" placeholder="Edit your mood description..."></textarea>
            <button onclick="saveEdit()">Save Changes</button>
            <button onclick="closeModal('edit-modal')">Cancel</button>
        </div>
    </div>

    <script>
        let editIndex = -1; // To track which entry is being edited

        // Update date and time in left corner
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('date-time').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Show mood modal on page load
        window.onload = function() {
            document.getElementById('mood-modal').style.display = 'block';
        };

        // Select mood and check if bad
        function selectMood(mood) {
            if (mood === '😢' || mood === '😡') {
                document.getElementById('flower').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('flower').style.display = 'none';
                }, 3000); // Hide flower after 3 seconds
            }
            saveMood(mood);
        }

        // Save mood to localStorage
        function saveMood(mood, text = '') {
            const now = new Date();
            const entry = {
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString(),
                mood: mood,
                text: text
            };
            let moods = JSON.parse(localStorage.getItem('moods')) || [];
            moods.push(entry);
            localStorage.setItem('moods', JSON.stringify(moods));
            document.getElementById('mood-modal').style.display = 'none';
            displayMoods();
        }

        // Open write modal
        function openWriteModal() {
            document.getElementById('write-modal').style.display = 'block';
        }

        // Save mood with text
        function saveMoodWithText() {
            const text = document.getElementById('mood-text').value;
            const mood = 'Custom'; // Or track selected mood
            saveMood(mood, text);
            closeModal('write-modal');
        }

        // Open add more modal
        function openAddMoreModal() {
            document.getElementById('add-more-modal').style.display = 'block';
        }

        // Save add more details (appends to the latest entry)
        function saveAddMore() {
            const text = document.getElementById('add-more-text').value;
            let moods = JSON.parse(localStorage.getItem('moods')) || [];
            if (moods.length > 0) {
                moods[moods.length - 1].text += ' ' + text; // Append to last entry
            }
            localStorage.setItem('moods', JSON.stringify(moods));
            closeModal('add-more-modal');
            displayMoods();
        }

        // Open edit modal for a specific entry
        function openEditModal(index) {
            editIndex = index;
            const moods = JSON.parse(localStorage.getItem('moods')) || [];
            const entry = moods[index];
            document.getElementById('edit-text').value = entry.text || '';
            document.getElementById('edit-modal').style.display = 'block';
        }

        // Set mood in edit modal
        function setEditMood(mood) {
            // This could be improved to highlight selected mood, but for simplicity, just store it
            document.getElementById('edit-modal').dataset.selectedMood = mood;
        }

        // Save edit changes
        function saveEdit() {
            const moods = JSON.parse(localStorage.getItem('moods')) || [];
            const selectedMood = document.getElementById('edit-modal').dataset.selectedMood || moods[editIndex].mood;
            moods[editIndex].mood = selectedMood;
            moods[editIndex].text = document.getElementById('edit-text').value;
            localStorage.setItem('moods', JSON.stringify(moods));
            closeModal('edit-modal');
            displayMoods();
        }

        // Delete entry
        function deleteEntry(index) {
            if (confirm('Are you sure you want to delete this entry?')) {
                let moods = JSON.parse(localStorage.getItem('moods')) || [];
                moods.splice(index, 1);
                localStorage.setItem('moods', JSON.stringify(moods));
                displayMoods();
            }
        }

        // Go to next page
        function goToNextPage() {
            window.location.href = 'page2.html';
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Display stored moods with edit/delete buttons
        function displayMoods() {
            const moods = JSON.parse(localStorage.getItem('moods')) || [];
            const list = document.getElementById('mood-list');
            list.innerHTML = '';
            moods.forEach((entry, index) => {
                const div = document.createElement('div');
                div.className = 'mood-entry';
                div.innerHTML = `
                    <div class="entry-content">
                        <strong>${entry.date} at ${entry.time}:</strong> ${entry.mood} ${entry.text ? '<br>' + entry.text : ''}
                    </div>
                    <div class="entry-actions">
                        <button class="edit-btn" onclick="openEditModal(${index})">Edit</button>
                        <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }
        displayMoods();
    </script>
</body>
</html>
